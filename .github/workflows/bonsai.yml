name: Grow Bonsai

on:
  schedule:
    - cron: "0 3 * * *" # re-grow daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # egorthinks/git-bonsai v1, pinned to a commit
      - uses: egorthinks/git-bonsai@665258cab3f304cfb33a96fc7bf108cec1f452f3
