<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient></defs>
<rect x="1" y="1" width="758" height="148" rx="14" fill="#161B22" stroke="url(#g)" stroke-width="1.5"/>
<text x="30" y="70" font-family="Georgia, serif" font-size="80" fill="url(#g)" opacity="0.5">“</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0001;0.0300;0.1700;0.2000;1" dur="30s" repeatCount="indefinite"/><text x="380.0" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-style="italic" fill="#E6EDF3">First, solve the problem. Then, write the code.</text><text x="380.0" y="108" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#36BCF7">— John Johnson</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2300;0.3700;0.4000;1" dur="30s" repeatCount="indefinite"/><text x="380.0" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-style="italic" fill="#E6EDF3">Talk is cheap. Show me the code.</text><text x="380.0" y="108" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#36BCF7">— Linus Torvalds</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4300;0.5700;0.6000;1" dur="30s" repeatCount="indefinite"/><text x="380.0" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-style="italic" fill="#E6EDF3">Make it work, make it right, make it fast.</text><text x="380.0" y="108" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#36BCF7">— Kent Beck</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6300;0.7700;0.8000;1" dur="30s" repeatCount="indefinite"/><text x="380.0" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-style="italic" fill="#E6EDF3">Simplicity is the soul of efficiency.</text><text x="380.0" y="108" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#36BCF7">— Austin Freeman</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8300;0.9700;1.0000;1" dur="30s" repeatCount="indefinite"/><text x="380.0" y="70" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-style="italic" fill="#E6EDF3">Programs must be written for people to read, and only incidentally for machines to execute.</text><text x="380.0" y="108" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#36BCF7">— Harold Abelson</text></g>
</svg>